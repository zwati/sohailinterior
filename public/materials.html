<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials Catalog — Sohail Interior</title>
  <meta name="description"
    content="Browse our catalog of premium window blinds, gypsum ceilings, wallpapers, fiber doors, and PVC paneling. Select styles, colors, and calculate quotes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="icon" type="image/png" href="/logo/SI_square.png">
  <link rel="stylesheet" href="/css/materials.css">
</head>

<body>

  <page-loader glass></page-loader>
  <announce-bar></announce-bar>
  <site-header></site-header>

  <!-- Main Content -->
  <main style="position: relative;">

    <!-- ============ MATERIALS CATALOG VIEW ============ -->
    <div class="page active" id="materialsPage">
      <div class="page-band">
        <div class="crumb mono">Home / Materials</div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <div class="view-toggle">
            <button class="active" id="viewGrid4" onclick="setGridCols(4, this)" aria-label="4 Column View"><svg
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
              </svg></button>
            <button id="viewGrid3" onclick="setGridCols(3, this)" aria-label="3 Column View"><svg viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="5" height="18" />
                <rect x="10" y="3" width="5" height="18" />
                <rect x="17" y="3" width="4" height="18" />
              </svg></button>
            <button id="viewGrid2" onclick="setGridCols(2, this)" aria-label="2 Column View"><svg viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="8" height="18" />
                <rect x="13" y="3" width="8" height="18" />
              </svg></button>
          </div>
          <button id="slideshowToggleBtn" onclick="toggleSlideshow()" aria-label="Toggle Slideshow"
            style="background: #fff; border: 1px solid var(--line); border-radius: 5px; height: 26px; padding: 0 10px; font-size: 11px; font-weight: 600; color: var(--navy); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.2s;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 3l14 9-14 9V3z" />
            </svg> Slideshow: OFF
          </button>
        </div>
        <select class="sort-select" id="sortSelect" onchange="handleSortChange(this.value)">
          <option value="best">Default Order</option>
          <option value="alphabetical">Alphabetically, A–Z</option>
        </select>
      </div>

      <!-- Grid -->
      <div class="catalog-wrap">
        <div class="pgrid" id="catalogGrid">
          <!-- Populated dynamically by materials.js -->
        </div>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="catalogPagination">
        <!-- Rendered by materials.js -->
      </div>
    </div>

    <!-- ============ CATEGORY DETAIL VIEW ============ -->
    <div class="page" id="detailPage" style="display: none;">
      <div class="detail-wrap">

        <!-- Breadcrumb -->
        <div class="crumbline">
          <a onclick="closeDetailView()">Home</a> &nbsp;/&nbsp;
          <a onclick="closeDetailView()">Materials</a> &nbsp;/&nbsp;
          <span id="dCrumbName">Category</span>
        </div>

        <!-- Category navigation chips -->
        <div class="filter-row" id="materialsFilters"></div>

        <div class="detail-grid">

          <!-- Left: Main image only -->
          <div class="detail-gallery-col">
            <div class="gallery-main" id="dMainImg"></div>
          </div>

          <!-- Right: Category info -->
          <div class="detail-info">
            <h1 id="dName">Category Name</h1>
            <div class="detail-item-count mono" id="dItemCount"></div>

            <!-- Price Display -->
            <div class="detail-price" id="dPrice" style="margin: 14px 0 20px;"></div>

            <!-- Finish Selection -->
            <div id="dFinishArea" style="display: none; margin-bottom: 20px;">
              <div class="opt-label">SELECT FINISH</div>
              <div class="opt-row" id="dFinishes"></div>
            </div>

            <div class="qty-row">
              <div class="qty-stepper">
                <button onclick="stepQty(-1)">&minus;</button>
                <span id="dQty">1</span>
                <button onclick="stepQty(1)">+</button>
              </div>
              <button class="btn btn-primary" id="dAddQuoteBtn">Add to Quote</button>
              <button class="btn btn-ghost" id="dWishlistBtn" title="Save to Wishlist">♥ Save</button>
              <button class="btn btn-ghost" id="dWhatsAppBtn">💬 Enquire on WhatsApp</button>
            </div>

            <p class="detail-desc" id="dDesc">Description.</p>

            <div class="meta-list">
              <div><b>Vendor:</b> Sohail Interior</div>
              <div><b>Category:</b> <span id="dCat"></span></div>
              <div><b>Availability:</b> In Stock &mdash; ready to schedule</div>
            </div>
          </div>

        </div>

        <!-- Full-width paginated gallery grid -->
        <div class="gallery-paginated-section">
          <div class="gal-grid" id="dGalleryGrid"></div>
          <div class="gallery-page-nav" id="dGalleryPagination"></div>
        </div>
      </div>
    </div>

    <!-- Full-Page Glass Lock Overlay -->
    <div class="page-lock-overlay" aria-hidden="true">
      <div class="glass-lock-content">
        <div class="glass-lock-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h3 class="glass-lock-title">Coming Soon</h3>
        <p class="glass-lock-subtitle">The Materials Catalog is currently being prepared.<br>Check back soon for our full collection.</p>
      </div>
    </div>

  </main>

  <site-footer></site-footer>
  <whatsapp-float></whatsapp-float>

  <script src="/js/components.js" defer></script>
  <script src="/js/common.js" defer></script>
  <script src="/js/materials.js" defer></script>
</body>

</html>
